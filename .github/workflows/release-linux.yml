---
name: Draft Linux release

# Release tags are plus-vX.Y.Z. The plain v* namespace belongs to the KDE
# Discover tags that come with the upstream history and must never start a
# release of the fork.
on:
  push:
    tags:
      - "plus-v*"

permissions:
  contents: read

concurrency:
  group: draft-linux-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release-source:
    name: Verify release source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.contract.outputs.version }}
      rpm-release: ${{ steps.contract.outputs.rpm-release }}
      sha: ${{ steps.contract.outputs.sha }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag, version, and master tip
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^plus-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must have the exact form plus-vX.Y.Z" >&2
            exit 1
          fi

          packaging/scripts/check-release-contract.sh "$GITHUB_REF_NAME"
          version=$(tr -d '\r\n' < VERSION)
          # The contract script has verified the form of the Release tag.
          rpm_release=$(awk '$1 == "Release:" { print $2; exit }' \
            packaging/rpm/discover-plus.spec)
          rpm_release=${rpm_release%'%{?dist}'}

          # Being an ancestor of master is not enough: every commit of
          # development and of KDE Discover is one. A release is cut from the
          # tip of master and from nothing else.
          git fetch --no-tags --prune origin \
            '+refs/heads/master:refs/remotes/origin/master'
          # The full ref name: a branch called like the tag must not matter.
          tagged_commit=$(git rev-parse --verify "refs/tags/$GITHUB_REF_NAME^{commit}")
          test "$tagged_commit" = "$(git rev-parse HEAD)"
          master_tip=$(git rev-parse origin/master)
          if [[ "$tagged_commit" != "$master_tip" ]]; then
            echo "tag $GITHUB_REF_NAME points to $tagged_commit, but the tip of master is $master_tip" >&2
            exit 1
          fi

          printf 'version=%s\nrpm-release=%s\nsha=%s\n' \
            "$version" "$rpm_release" "$tagged_commit" >> "$GITHUB_OUTPUT"

  build-packages:
    name: Rebuild release packages
    needs: verify-release-source
    permissions:
      contents: read
    uses: ./.github/workflows/package-linux.yml
    with:
      source-sha: ${{ needs.verify-release-source.outputs.sha }}
      # Empty or unset means the latest stable Fedora. The repository variable
      # lets a release be built for the previous stable Fedora without a
      # commit on master, for example while the build for a brand-new Fedora
      # is broken. package-linux.yml checks the value against releases.json.
      fedora-version: ${{ vars.RELEASE_FEDORA_VERSION }}

  draft-release:
    name: Attest assets and create draft
    needs:
      - verify-release-source
      - build-packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      EXPECTED_SHA: ${{ needs.verify-release-source.outputs.sha }}
    steps:
      - name: Refuse to replace an existing Release or to follow a moved tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Shared with the last step. Both guards fail closed: an API error
          # stops the job instead of looking like "nothing there".
          cat > "$RUNNER_TEMP/release-guards.sh" <<'GUARDS'
          # The release list includes drafts for a token with contents: write;
          # "gh release view" cannot tell "not found" from an API error.
          refuse_existing_release() {
            local release_ids
            release_ids=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
              --jq '.[] | select(.tag_name == env.RELEASE_TAG) | .id')
            if [[ -n "$release_ids" ]]; then
              echo "a GitHub Release already exists for $RELEASE_TAG; refusing to overwrite it" >&2
              return 1
            fi
          }

          # The packages were built from EXPECTED_SHA. "--verify-tag" only
          # checks that the tag exists, not where it points to by now.
          require_unmoved_tag() {
            local object object_type object_sha
            object=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" \
              --jq '.object.type + " " + .object.sha')
            # An annotated tag is an object of its own in front of the commit.
            for _ in 1 2 3 4 5; do
              object_type=${object%% *}
              object_sha=${object##* }
              if [[ "$object_type" != tag ]]; then
                break
              fi
              object=$(gh api "repos/$GH_REPO/git/tags/$object_sha" \
                --jq '.object.type + " " + .object.sha')
            done
            if [[ "$object_type" != commit || "$object_sha" != "$EXPECTED_SHA" ]]; then
              echo "tag $RELEASE_TAG now points to $object_type $object_sha, the packages were built from $EXPECTED_SHA" >&2
              return 1
            fi
          }
          GUARDS
          # shellcheck source=/dev/null
          source "$RUNNER_TEMP/release-guards.sh"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          refuse_existing_release
          require_unmoved_tag

      - name: Download package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: discover-plus-rpm-f*-${{ github.run_id }}
          path: release-assets
          merge-multiple: true

      - name: Verify release asset set and create checksums
        env:
          RELEASE_VERSION: ${{ needs.verify-release-source.outputs.version }}
          RPM_RELEASE: ${{ needs.verify-release-source.outputs.rpm-release }}
          FEDORA_VERSION: ${{ needs.build-packages.outputs.fedora-version }}
        shell: bash
        run: |
          set -euo pipefail
          nvr="$RELEASE_VERSION-$RPM_RELEASE.fc$FEDORA_VERSION"
          for asset in \
            "discover-plus-$nvr.x86_64.rpm" \
            "discover-plus-debuginfo-$nvr.x86_64.rpm" \
            "discover-plus-debugsource-$nvr.x86_64.rpm" \
            "discover-plus-$nvr.src.rpm" \
            "discover-plus-$nvr.build-environment.txt" \
            "discover-plus-$RELEASE_VERSION.tar.xz"
          do
            test -f "release-assets/$asset"
          done
          test "$(find release-assets -mindepth 1 | wc -l)" -eq 6
          # The record of the build must describe this very source.
          grep -Fxq "# source: $EXPECTED_SHA" \
            "release-assets/discover-plus-$nvr.build-environment.txt"

          checksum_file="$RUNNER_TEMP/SHA256SUMS"
          (
            cd release-assets
            find . -maxdepth 1 -type f -printf '%P\0' |
              LC_ALL=C sort -z |
              xargs -0 sha256sum > "$checksum_file"
          )
          test "$(wc -l < "$checksum_file")" -eq 6
          mv "$checksum_file" release-assets/SHA256SUMS
          (
            cd release-assets
            sha256sum --check SHA256SUMS
          )

      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-assets/*.rpm
            release-assets/*.tar.xz
            release-assets/*.build-environment.txt
            release-assets/SHA256SUMS

      - name: Preserve aggregated release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release-assets-${{ github.run_id }}
          path: release-assets/*
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      # The workflow token creates the Release, so its author is
      # github-actions. The maintainer only pushes the tag and publishes the
      # draft after installing the package on a real Fedora KDE system.
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.verify-release-source.outputs.version }}
          RPM_RELEASE: ${{ needs.verify-release-source.outputs.rpm-release }}
          FEDORA_VERSION: ${{ needs.build-packages.outputs.fedora-version }}
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source "$RUNNER_TEMP/release-guards.sh"
          refuse_existing_release
          require_unmoved_tag

          rpm_name="discover-plus-$RELEASE_VERSION-$RPM_RELEASE.fc$FEDORA_VERSION.x86_64.rpm"
          notes_file="$RUNNER_TEMP/release-notes.md"
          # The backticks are Markdown, not command substitutions.
          # shellcheck disable=SC2016
          {
            printf '# Discover Plus %s\n\n' "$RELEASE_VERSION"
            printf 'RPM package for Fedora %s (x86_64). It replaces the stock `plasma-discover` packages.\n\n' "$FEDORA_VERSION"
            printf 'Update the system first, then install the package:\n\n'
            printf '```bash\nsudo dnf upgrade --refresh\nsudo dnf install ./%s\n```\n\n' "$rpm_name"
            printf 'There is no package repository yet: new versions are installed the same way from the next release.\n\n'
            printf 'Verify the download:\n\n'
            printf '```bash\nsha256sum --check --ignore-missing SHA256SUMS\ngh attestation verify %s -R %s\n```\n\n' "$rpm_name" "$GH_REPO"
            printf 'The `build-environment.txt` file records the Fedora image digest, the source commit and the packages of the build environment.\n\n'
            printf 'Removing an application now also removes its unused dependencies, like the stock Fedora Discover does. Installations made with `install.sh` did not do that.\n\n'
            printf 'This release stays a draft until the package has been installed over the stock Discover on a real Fedora KDE system.\n'
          } > "$notes_file"

          gh release create "$RELEASE_TAG" \
            release-assets/* \
            --draft \
            --title "Discover Plus $RELEASE_VERSION" \
            --notes-file "$notes_file" \
            --verify-tag

          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          # The tag may have moved while the assets were uploading.
          require_unmoved_tag
